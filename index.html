<!doctype html>
<html lang="de">
<head>

<title>Einkaufsbudget</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#1b2422;--muted:#66736f;--line:#e1e7e5;--brand:#1f6f5c;--brand2:#e6f2ee;--warn:#c27c0e;--bad:#c0392b;--good:#2e7d4f;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}

header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
header.top h1{font-size:20px;margin:0}
header.top .who{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.sec,.btn.sec{background:var(--brand2);color:var(--brand)}
button.ghost{background:transparent;color:var(--brand);padding:8px 10px}
button.danger{background:#fdecea;color:var(--bad)}
button.block,.btn.block{width:100%}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.money-big{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.bar{height:12px;background:var(--brand2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar>div{height:100%;border-radius:99px;background:var(--good);transition:width .4s}
.bar.warn>div{background:var(--warn)} .bar.bad>div{background:var(--bad)}
.monthnav{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px}
.monthnav b{min-width:150px;text-align:center}
.monthnav button{background:transparent;color:var(--brand);font-size:22px;padding:4px 14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;background:transparent;color:var(--muted);border-radius:0;flex-direction:column;gap:2px;padding:9px 4px 10px;font-size:12px;font-weight:600}
nav.tabs button .i{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brand)}
nav.tabs button.plus .i{background:var(--brand);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:22px}
.chart{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.chart svg{width:200px;height:200px;flex:none}
.legend{flex:1;min-width:210px;list-style:none;margin:0;padding:0}
.legend li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.legend li:last-child{border:0}
.dot{width:11px;height:11px;border-radius:3px;flex:none}
.legend .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .p{color:var(--muted);width:44px;text-align:right;font-size:13px}
.legend .v{font-weight:600;width:82px;text-align:right}
.seg{display:inline-flex;background:var(--brand2);border-radius:10px;padding:3px}
.seg button{background:transparent;color:var(--brand);padding:6px 12px;font-size:13px;border-radius:8px}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.hbar{margin:8px 0}
.hbar .t{display:flex;justify-content:space-between;font-size:14px}
.hbar .b{height:8px;background:var(--brand2);border-radius:99px;margin-top:3px}
.hbar .b div{height:100%;background:var(--brand);border-radius:99px}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border:0}
.badge{width:40px;height:40px;border-radius:12px;background:var(--brand2);color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.list .it .m{flex:1;min-width:0}
.list .it .m div:first-child{font-weight:600}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.stores button{background:var(--brand2);color:var(--ink);padding:16px 6px;font-weight:600}
.stores button.on{background:var(--brand);color:#fff}
.steps{display:flex;gap:6px;margin:6px 0 2px}
.steps div{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps div.on{background:var(--brand)}
.item{display:grid;grid-template-columns:1fr 92px 36px;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.item .name{grid-column:1/2}
.item .r2{grid-column:1/3;display:flex;gap:6px}
.item .qty{width:62px;flex:none;text-align:right;padding:7px 8px;font-size:14px}
.item .unit{width:66px;flex:none;padding:7px 6px;font-size:14px}
.item .cat{flex:1;font-size:14px;padding:7px 10px}
.item .up{grid-column:1/3;font-size:12px;color:var(--muted);margin-top:-2px}
.item .price{text-align:right}
.item .del{grid-row:1/4;grid-column:3;background:transparent;color:var(--muted);padding:0;font-size:20px}
.item .catdot{display:none}
.sumbox{background:var(--brand2);border-radius:12px;padding:12px;margin-top:12px}
.warnbox{background:#fff4e0;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}

.prog{height:8px;background:var(--brand2);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.prog div{height:100%;background:var(--brand);width:0;transition:width .2s}
.preview{max-width:100%;max-height:260px;border-radius:12px;display:block;margin:10px auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--brand2);color:var(--ink);border-radius:99px;padding:6px 6px 6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.chip button{background:transparent;color:var(--muted);padding:0 6px;font-size:16px}
#modal .bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){#modal .bg{align-items:center}#modal .sheet{border-radius:20px}}
#modal h3{margin:0 0 10px;font-size:19px}
#modal ul{margin:4px 0 10px;padding-left:20px}
#modal h4{margin:14px 0 2px;font-size:14px;color:var(--brand)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2422;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.center{text-align:center}
.welcome{padding-top:calc(30px + env(safe-area-inset-top))}
.welcome h1{font-size:26px;margin:0 0 4px}
details summary{cursor:pointer;color:var(--brand);font-size:14px;margin-top:10px}
pre.ocr{white-space:pre-wrap;font-size:12px;background:var(--bg);padding:10px;border-radius:10px;max-height:220px;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;white-space:nowrap}
.tbl td.grp{text-align:left}
.grp{font-weight:700;color:var(--brand);padding-top:12px!important}
.dictrow{display:grid;grid-template-columns:1fr 150px 32px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.dictrow select{padding:6px;font-size:13px}
.dictrow button{background:transparent;color:var(--muted);padding:0}
.pbadge{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--brand2);color:var(--muted)}
.pbadge.up{background:#fdecea;color:var(--bad)} .pbadge.down{background:#e7f5ec;color:var(--good)}
@media (prefers-color-scheme:dark){.pbadge.up{background:#3a1d1a}.pbadge.down{background:#173322}}
.item .del{grid-row:1/2!important}
.item .brand{flex:1;padding:7px 10px;font-size:14px}
.item .up{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:22px}
.item .snipwrap{grid-column:1/4}
.item.pf .name{color:var(--muted)}
button.mini{background:var(--brand2);color:var(--brand);padding:3px 9px;font-size:12px;border-radius:8px;font-weight:600}
.crop{position:relative;width:100%;background-repeat:no-repeat;border-radius:8px;border:1px solid var(--line);margin-top:4px;cursor:zoom-in;background-color:#fff}
.hl{position:absolute;background:rgba(255,213,0,.28);border:2px solid #f2b705;border-radius:3px;pointer-events:none}
.drow{display:grid;grid-template-columns:1fr 92px auto 32px;gap:6px;align-items:center;margin-bottom:6px}
.drow .del{background:transparent;color:var(--muted);padding:0;font-size:20px}
.drow .price{text-align:right}
.beleg{position:relative;margin-bottom:8px}
.beleg img{width:100%;display:block;border-radius:8px;border:1px solid var(--line)}
.bchip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--brand2);color:var(--brand);font-weight:600;margin-left:4px;vertical-align:1px}
</style>
</head>

const DEFAULT_STORES = ['Rewe','Aldi','Lidl','Edeka','Penny','Netto','Kaufland','Norma','dm','Rossmann'];

/* ============ Hilfsfunktionen ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const euro = n => fmt.format(n || 0);
const r2 = n => Math.round((n || 0) * 100) / 100;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const monthKey = d => (d || todayISO()).slice(0, 7);
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const monthName = m => MONTHS[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4);
const dateDE = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : '';

const moneyInput = n => (n === '' || n == null) ? '' : r2(n).toFixed(2).replace('.', ',');

function norm(s){
  return String(s || '').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')

}

});

function categorize(name){
  const n = norm(name);
  if (!n) return 'sonstiges';
  const learned = S.dict[n];
  if (learned) return learned.c;
  const spaced = ' ' + n + ' ', desp = n.replace(/ /g, '');
  let best = null, bestLen = 0;
  for (const {k, cat} of KW){
    if (k.length <= bestLen) continue;
    const hit = k.length <= 3 ? spaced.includes(' ' + k + ' ') : desp.includes(k);
    if (hit){ best = cat; bestLen = k.length; }
  }
  if (!best){
    // gelernte Einträge als Teilwort probieren (z. B. "ja milch 3,5" -> "milch")
    for (const key in S.dict){ if (key.length >= 5 && key.length > bestLen && desp.includes(key.replace(/ /g,''))){ best = S.dict[key].c; bestLen = key.length; } }
  }
  return best || 'sonstiges';
}

function niceName(s){
  s = s.replace(/\s+/g,' ').trim();
  const letters = s.replace(/[^A-Za-zÄÖÜäöüß]/g,'');
  const upper = letters.replace(/[^A-ZÄÖÜ]/g,'').length;
  if (letters.length && upper / letters.length > 0.7){
    s = s.toLowerCase().replace(/(^|[\s\-\/.(])([a-zäöü])/g, (m,a,b) => a + b.toUpperCase());
  }
  return s;
}

/* ============ Bon-Erkennung (Text -> Artikel) ============ */
const FINAL_RE = /(zu zahlen|zuzahlen|zahlbetrag|gesamtbetrag|endsumme|\btotal\b)/;
const SUB_RE = /(^|\s)(summe|gesamt)\b/;
const PAY_RE = /(gegeben|\bgeg\b|\bbar\b|ec.?cash|girocard|kartenzahlung|visa|mastercard|maestro|kreditkarte|r[uü]ckgeld|wechselgeld|\bmwst|steuer|\bnetto\b|\bbrutto\b)/;
const SKIP_RE = /(zwischensumme|gegeben|r[uü]ckgeld|wechselgeld|ec.?cash|girocard|kartenzahlung|visa|mastercard|maestro|kreditkarte|\bbar\b|\bmwst|\bust\b|steuer|\bnetto\b|\bbrutto\b|\bbetrag\b|bon.?nr|\bkasse\b|\btse\b|datum|uhrzeit|filiale|\btel\b|telefon|ust.?id|payback.?punkte|punktestand|anzahl artikel|posten|kundenbeleg|terminal|transaktion|signatur|seriennummer|www\.|danke|öffnungszeiten|oeffnungszeiten)/;
const PRICE_RE = /(-)?\s?(\d{1,4})\s?[.,]\s?(\d{2})\s*(-)?((?:\s*(?:€|eur|EUR|Eur|[A-Za-z*#]{1,2}|\d)){0,3})\s*$/;
const PFAND_RE = /(pfand|leergut|einweg|mehrweg)/;
const RDISC_RE = /(mitarbeiter|mitarb|\bma\b|ma.?rabatt|personal|belegschaft|angestellt)/;
const DISC_WORD_RE = /(rabatt|nachlass|coupon|vorteil|gutschein|abzug)/;
const QTY_RE = /(\d+(?:[.,]\d{1,3})?)\s*(kg|stk|st|stück)?\.?\s*[x×*]\s*(\d+[.,]\d{2})/i;
const QTY_REV_RE = /(\d+[.,]\d{2})\s*€?\s*[x×*]\s*(\d{1,2})\s*$/;
function readQty(str){
  const m = QTY_RE.exec(str); if (!m) return null;
  let q = parseFloat(m[1].replace(',', '.')); const up = parseFloat(m[3].replace(',', '.'));
  if (!(q > 0) || !(up > 0)) return null;
  let unit = (m[2] && /kg/i.test(m[2])) || /[.,]\d{3}/.test(m[1]) || /\bkg\b/i.test(str) ? 'kg' : 'Stk';
  if (unit === 'Stk' && q % 1) unit = 'kg';
  return {qty: unit === 'kg' ? Math.round(q * 1000) / 1000 : q, unit, up};
}
const qtyFits = (price, q) => q && Math.abs(q.qty * q.up - price) <= Math.max(0.03, Math.abs(price) * 0.02);
function mergeSrc(a, b){
  if (!a) return b || null; if (!b || a.i !== b.i) return a;
  return {i: a.i, b: [Math.min(a.b[0], b.b[0]), Math.min(a.b[1], b.b[1]), Math.max(a.b[2], b.b[2]), Math.max(a.b[3], b.b[3])]};
}

const BRAND_KEYS = BRANDS.map(b => ({b, k: norm(b)})).sort((a, b) => b.k.length - a.k.length);
function detectBrand(name, store){
  const n = norm(name); if (!n) return '';
  const sp = ' ' + n + ' ';
  for (const r of OWN_LUX) if (r.test(n)) return BR_LUX;
  for (const {b, k} of BRAND_KEYS) if (k.length >= 3 && sp.includes(' ' + k + ' ')) return b;
  for (const r of OWN_CHEAP) if (r.test(n)) return BR_CHEAP;
  const st = norm(store || '');
  if (st && (n.startsWith(st + ' ') || /^(rewe|edeka|penny|netto|kaufland|lidl|aldi|norma|dm|rossmann) /.test(n))) return BR_CHEAP;
  return '';
}
function mkSize(v, u){ u = u === 'gr' ? 'g' : u === 'ltr' ? 'l' : u; if (u === 'cl'){ v *= 10; u = 'ml'; } return v > 0 ? {v: Math.round(v * 1000) / 1000, u} : null; }
function detectSize(name){
  const s = String(name || '').toLowerCase().replace(/,/g, '.');
  let m = /(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(kg|g|gr|l|ltr|ml|cl)\b/.exec(s);
  if (m) return mkSize(+m[1] * +m[2], m[3]);
  m = /(\d+(?:\.\d+)?)\s*(kg|g|gr|l|ltr|ml|cl)\b/.exec(s); if (m) return mkSize(+m[1], m[2]);
  m = /\b(\d{1,3})\s*(er|stk|st|stück)\b/.exec(s); if (m && +m[1] > 1) return {v: +m[1], u: 'Stk'};
  return null;
}
function enrichItem(it, store){
  const l = S.dict[norm(it.name)];
  if (!it.brand) it.brand = (l && l.b) || detectBrand(it.name, store);
  if (!it.size) it.size = (l && l.s) || detectSize(it.name);
  return it;
}
// Grundpreis: je kg / l / Stück Inhalt, sonst je Packung (Stk)
function basePrice(it){
  const per = (+it.price || 0) / qtyOf(it);
  if (unitOf(it) === 'kg') return {v: per, u: 'kg'};
  const s = it.size;
  if (s && s.v > 0){
    if (s.u === 'g') return {v: per / (s.v / 1000), u: 'kg'};
    if (s.u === 'kg') return {v: per / s.v, u: 'kg'};
    if (s.u === 'ml') return {v: per / (s.v / 1000), u: 'l'};
    if (s.u === 'l') return {v: per / s.v, u: 'l'};
    if (s.u === 'Stk') return {v: per / s.v, u: 'St.'};
  }
  return {v: per, u: 'Stk'};
}
const sizeLabel = s => s && s.v > 0 ? String(s.v).replace('.', ',') + ' ' + (s.u === 'Stk' ? 'St.' : s.u) : '';

function parseReceipt(src, store){
  const raw = Array.isArray(src) ? src : String(src || '').split(/\r?\n/).map(t => ({t}));
  const lines = raw.map(l => ({t: String(l.t || '').replace(/[|_~»«]/g,' ').replace(/\s+/g,' ').trim(), s: l.b ? {i: l.i || 0, b: l.b} : null})).filter(l => l.t);
  const items = [], discounts = []; let bonTotal = null, subTotal = null, after = false, pending = null, pendQty = null;
  const lettersOf = str => str.replace(/\d+([.,]\d+)?/g,' ').replace(/\b(kg|g|stk|st|stück|x|eur|euro|l|ml)\b/gi,' ').replace(/[€\/*x×]/gi,' ').replace(/[^A-Za-zÄÖÜäöüß]/g,'').length;
  const priceOf = m => parseFloat(m[2] + '.' + m[3]);
  const mk = (name, price, cat, s) => ({name, price: r2(price), cat, qty: 1, unit: 'Stk', brand: '', size: null, src: s || null});
  const attach = (q, s) => { const prev = items[items.length - 1]; if (prev && !prev._q && qtyFits(prev.price, q)){ prev.qty = q.qty; prev.unit = q.unit; prev._q = true; prev.src = mergeSrc(prev.src, s); return true; } return false; };
  const addToPrev = (val, s) => { const p = items[items.length - 1]; if (!p) return false; p.price = r2(p.price + val); p.src = mergeSrc(p.src, s); return true; };
  for (let i = 0; i < lines.length; i++){
    const L = lines[i], line = L.t, low = line.toLowerCase();
    const nextPrice = () => lines[i+1] && /^[-\s\d.,€eurEUR*AB]+$/.test(lines[i+1].t) ? PRICE_RE.exec(lines[i+1].t) : null;
    if (FINAL_RE.test(low)){ const m = PRICE_RE.exec(line) || nextPrice(); if (m) bonTotal = r2(priceOf(m)); break; }
    if (SUB_RE.test(low) && !/zwischensumme/.test(low)){ const m = PRICE_RE.exec(line) || nextPrice(); if (m) subTotal = r2(priceOf(m)); after = true; pending = null; pendQty = null; continue; }
    if (after && PAY_RE.test(low)) break;
    if (SKIP_RE.test(low)){ pending = null; continue; }
    const m = PRICE_RE.exec(line);
    if (!m){
      if (after) continue;
      const q = readQty(line);
      if (q && lettersOf(line) < 4){ if (!attach(q, L.s)) pendQty = q; continue; }
      // Name ohne Preis (z. B. Waage-Artikel) – Preis steht evtl. in der nächsten Zeile
      const nm = line.replace(/\s*\d+([.,]\d+)?\s*kg\b.*$/i,'').trim();
      pending = nm.replace(/[^A-Za-zÄÖÜäöüß]/g,'').length >= 3 ? {t: nm, s: L.s} : null;
      pendQty = pending ? q : null;
      continue;
    }
    let val = priceOf(m);
    const neg = !!(m[1] || m[4]);
    if (neg) val = -val;
    let name = line.slice(0, m.index).trim();
    const lname0 = name.toLowerCase();
    const isPf = PFAND_RE.test(lname0);
    const isRDisc = RDISC_RE.test(lname0) && (neg || DISC_WORD_RE.test(lname0));
    if (after){
      if (isPf) items.push(mk(niceName(name) || 'Pfand', val, 'pfand', L.s));
      else if (neg || DISC_WORD_RE.test(lname0)) discounts.push({name: niceName(name) || 'Rabatt', amount: -Math.abs(r2(val)), src: L.s});
      continue;
    }
    if (isRDisc){ discounts.push({name: niceName(name) || 'Mitarbeiterrabatt', amount: -Math.abs(r2(val)), src: L.s}); continue; }
    if (isPf){ const pq = readQty(name) || (QTY_REV_RE.exec(name) ? {qty: +QTY_REV_RE.exec(name)[2], unit: 'Stk', up: parseFloat(QTY_REV_RE.exec(name)[1].replace(',', '.'))} : null);
      const pit = mk(niceName(name.replace(/\s+\d+[.,]\d{2}\s*(€|eur)?\s*$/i,'').replace(/\s+\d+\s*[x×*]\s*\d+[.,]\d{2}.*$/,'').replace(/\s+\d+[.,]\d{2}\s*€?\s*[x×*]\s*\d+\s*$/,'')) || 'Pfand', val, 'pfand', L.s); if (qtyFits(val, pq)) pit.qty = pq.qty; items.push(pit); pending = null; pendQty = null; continue; }
    const letters = lettersOf(name);
    const lineQ = readQty(name) || readQty(line);
    // Zeile mit Einzel-/Kilopreis am Ende ("Tomaten 0,612 kg x 2,99 EUR") – Gesamtpreis folgt
    if (lineQ && !neg && lineQ.qty !== 1 && Math.abs(lineQ.up - val) < 0.005 && !qtyFits(val, lineQ)){
      if (letters >= 3){ pending = {t: name.replace(/\s+\d+([.,]\d{1,3})?\s*(kg|stk|st)?\.?\s*[x×*]?\s*$/i,'').trim(), s: L.s}; pendQty = lineQ; }
      else if (!attach(lineQ, L.s)) pendQty = lineQ;
      continue;
    }
    const isInfo = /(\bkg\b|eur\s*\/|€\s*\/|\/\s*kg|\bstk\b|\d\s*[x×*]\s*\d)/i.test(name) || (lineQ && letters < 3);
    let lineQty = null, src = L.s;
    if (isInfo && letters < 4){
      if (pending && !neg && (!lineQ || qtyFits(val, lineQ))){ name = pending.t; src = mergeSrc(pending.s, L.s); pending = null; lineQty = lineQ; pendQty = null; }
      else { if (lineQ && !attach(lineQ, L.s)) pendQty = lineQ; continue; }
    }
    else if (letters < 3 && pending && !neg){ name = pending.t; src = mergeSrc(pending.s, L.s); pending = null; lineQty = pendQty; pendQty = null; }
    else if (letters < 3){ if (neg) addToPrev(val, L.s); continue; }
    // Menge in derselben Zeile: "Banane 2 x 0,89", "Banane 0,89 x 2", "2 x Joghurt"
    let q2 = lineQty ? null : readQty(name);
    if (!q2 && !lineQty){ const mr = QTY_REV_RE.exec(name); if (mr) q2 = {qty: +mr[2], unit: 'Stk', up: parseFloat(mr[1].replace(',', '.'))}; }
    if (!q2 && !lineQty){ const ml = /^(\d{1,2})\s*[x×*]\s+/.exec(name); if (ml && +ml[1] > 0) q2 = {qty: +ml[1], unit: 'Stk', up: val / +ml[1]}; }
    name = name.replace(/^\d{4,}\s*/,'')
               .replace(/^\d{1,2}\s*[x×*]\s+/,'')
               .replace(/\s+\d+([.,]\d{1,3})?\s*(kg|stk|st)?\.?\s*[x×*]\s*\d+[.,]\d{2}.*$/i,'')
               .replace(/\s+\d+[.,]\d{2}\s*€?\s*[x×*]\s*\d{1,2}\s*$/,'')
               .replace(/\s+[x×*]\s*\d+\s*$/,'')
               .replace(/\s+\d+\s*(stk|st)\.?\s*$/i,'')
               .trim();
    if (neg){ if (addToPrev(val, L.s)) continue; }
    if (Math.abs(val) > 400) continue; // OCR-Unsinn
    const nn = niceName(name);
    const item = mk(nn, val, categorize(nn), src);
    const q = [q2, lineQty, pendQty].find(x => qtyFits(val, x));
    if (q){ item.qty = q.qty; item.unit = q.unit; item._q = true; }
    pending = null; pendQty = null;
    items.push(item);
  }
  items.forEach(it => { delete it._q; enrichItem(it, store); });
  if (bonTotal == null) bonTotal = subTotal;
  return {items, discounts, bonTotal};
}

async function hashPw(pw, salt){
  const data = new TextEncoder().encode('eb|' + salt + '|' + pw);
  if (window.crypto && crypto.subtle){
    const b = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
  }
  let h1 = 0x811c9dc5, h2 = 0x1b873593;
  for (const x of data){ h1 = Math.imul(h1 ^ x, 16777619); h2 = Math.imul(h2 ^ x, 2246822507); }
  return 'f' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

function catAmounts(r){
  const out = r.items.map(it => ({cat: it.cat, v: +it.price || 0}));
  const ds = discSum(r);
  if (ds){ const base = out.filter(o => o.v > 0 && o.cat !== 'pfand'); const tot = base.reduce((a, o) => a + o.v, 0);
    if (tot > 0) base.forEach(o => o.v += o.v / tot * ds); else out.push({cat: 'sonstiges', v: ds}); }
  return out;
}

/* ============ Belegarchiv (IndexedDB) ============ */
const Arch = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const rq = indexedDB.open('einkaufsbudget', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('belege');
        rq.onsuccess = () => { this.db = rq.result; res(this.db); };
        rq.onerror = () => rej(rq.error);
      } catch(e){ rej(e); }
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('belege', mode); const rq = fn(t.objectStore('belege')); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  put(id, imgs){ return this.tx('readwrite', st => st.put(imgs, id)); },
  get(id){ return this.tx('readonly', st => st.get(id)); },
  del(id){ return this.tx('readwrite', st => st.delete(id)); }
};
const imgCache = {};
function dataToBlob(d){ const [h, b] = d.split(','); const bin = atob(b); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], {type: (h.match(/:(.*?);/) || [, 'image/jpeg'])[1]}); }
const withUrl = x => Object.assign({}, x, {url: URL.createObjectURL(dataToBlob(x.data))});
async function loadImgs(id){
  if (imgCache[id]) return imgCache[id];
  let arr = null; try { arr = await Arch.get(id); } catch(e){}
  if (!arr || !arr.length) return null;
  return (imgCache[id] = arr.map(withUrl));
}
const plainImgs = imgs => (imgs || []).map(({data, w, h, tb}) => ({data, w, h, tb}));

// Ausschnitt des Belegs rund um eine Zeile (mit Markierung)
function snippet(src, imgs, onclick){
  const im = imgs && src && src.b && imgs[src.i]; if (!im) return '';
  const [x0, y0, x1, y1] = src.b; const lh = Math.max(y1 - y0, 0.004);
  const tb = im.tb || [0, 1];
  const rx0 = Math.max(0, Math.min(tb[0], x0) - 0.02), rx1 = Math.min(1, Math.max(tb[1], x1) + 0.02);
  const ry0 = Math.max(0, y0 - lh * 2.4), ry1 = Math.min(1, y1 + lh * 2.4);
  const sx = Math.max(rx1 - rx0, 0.05), sy = Math.max(ry1 - ry0, 0.005);
  const ar = (sx * im.w) / (sy * im.h);
  const px = sx >= 0.999 ? 0 : rx0 / (1 - sx) * 100, py = sy >= 0.999 ? 0 : ry0 / (1 - sy) * 100;
  return `<div class="crop" ${onclick ? `onclick="${onclick}"` : ''} style="aspect-ratio:${ar.toFixed(4)};background-image:url('${im.url}');background-size:${(100 / sx).toFixed(3)}% auto;background-position:${px.toFixed(3)}% ${py.toFixed(3)}%"><div class="hl" style="left:${((x0 - rx0) / sx * 100).toFixed(2)}%;width:${((x1 - x0) / sx * 100).toFixed(2)}%;top:${((y0 - ry0) / sy * 100).toFixed(2)}%;height:${((y1 - y0) / sy * 100).toFixed(2)}%"></div></div>`;
}

function donut(parts, total){
  const R = 70, C = 2 * Math.PI * R; let off = 0;
  const segs = parts.map(p => { const len = total > 0 ? p.v / total * C : 0; const s = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${p.color}" stroke-width="34" stroke-dasharray="${Math.max(len-1.2,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(p.name)}: ${euro(p.v)}</title></circle>`; off += len; return s; }).join('');
  const top = parts[0];
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Ausgaben nach Kategorie">
    <circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--brand2)" stroke-width="34"/>${segs}
    <text x="100" y="94" text-anchor="middle" font-size="12" fill="var(--muted)">${top ? 'Am meisten' : 'Noch keine'}</text>
    <text x="100" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${top ? esc(shortName(top.name)) : 'Ausgaben'}</text>
    ${top ? `<text x="100" y="129" text-anchor="middle" font-size="12" fill="var(--muted)">${euro(top.v)}</text>` : ''}</svg>`;
}
const shortName = n => n.replace(/ \(.*\)/,'').split(/,| & /)[0].slice(0, 16);

function viewDash(){
  const m = ui.month, rs = ofMonth(m);
  const spent = r2(rs.reduce((a, r) => a + rTotal(r), 0));
  const budget = budgetOf(m), left = r2(budget - spent);
  const pct = budget > 0 ? spent / budget : 0;
  const cls = pct > 1 ? 'bad' : pct > .85 ? 'warn' : '';
  let extra = '';
  if (m === monthKey()){
    const d = new Date(), dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(), rest = dim - d.getDate() + 1;
    extra = `<div class="small muted">Noch ${rest} Tag${rest===1?'':'e'} im Monat${left > 0 ? ` · ca. ${euro(left / rest)} pro Tag` : ''}</div>`;
  }
  // Kategorien
  const map = {};
  rs.forEach(r => catAmounts(r).forEach(it => {
    const key = ui.chart === 'cat' ? it.cat : (CAT[it.cat] || CAT.sonstiges).g;
    map[key] = (map[key] || 0) + it.v;
  }));
  let parts = Object.entries(map).filter(([, v]) => v > 0.004).map(([k, v]) => {
    const meta = ui.chart === 'cat' ? (CAT[k] || CAT.sonstiges) : GROUPS[k];
    return {name: meta.name, color: meta.color, v: r2(v)};
  }).sort((a, b) => b.v - a.v);
  if (parts.length > 8){ const rest = parts.slice(7); parts = parts.slice(0, 7); parts.push({name:'Weitere', color:'#cfd8dc', v:r2(rest.reduce((a, p) => a + p.v, 0))}); }
  const ptotal = parts.reduce((a, p) => a + p.v, 0);
  // Geschäfte
  const st = {}; rs.forEach(r => st[r.store] = (st[r.store] || 0) + rTotal(r));
  const stores = Object.entries(st).sort((a, b) => b[1] - a[1]);
  const smax = stores.length ? Math.max(...stores.map(s => s[1])) : 1;
  const recent = rs.slice().sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 5);
  return `${monthNav()}
  <div class="card">
    <div class="small muted">${left >= 0 ? 'Noch verfügbar' : 'Budget überschritten um'}</div>
    <div class="money-big" style="color:${left < 0 ? 'var(--bad)' : 'inherit'}">${euro(Math.abs(left))}</div>
    <div class="bar ${cls}"><div style="width:${Math.min(pct, 1) * 100}%"></div></div>
    <div class="spread small"><span>Ausgegeben <b>${euro(spent)}</b></span><span class="muted">Budget ${euro(budget)}</span></div>
    ${extra}
    ${!isAdmin() && S.pkgDate ? `<div class="small muted" style="margin-top:6px">Stand vom Admin: ${new Date(S.pkgDate).toLocaleDateString('de-DE')} + deine neuen Einkäufe</div>` : ''}
  </div>
  <div class="card"><div class="spread"><h2 style="margin:0">Wofür am meisten?</h2>
    <div class="seg"><button class="${ui.chart==='cat'?'on':''}" onclick="A.chart('cat')">Kategorien</button><button class="${ui.chart==='grp'?'on':''}" onclick="A.chart('grp')">Bereiche</button></div></div>
    <div class="chart" style="margin-top:10px">${donut(parts, ptotal)}
    <ul class="legend">${parts.length ? parts.map(p => `<li><span class="dot" style="background:${p.color}"></span><span class="n">${esc(p.name)}</span><span class="p">${Math.round(p.v / ptotal * 100)} %</span><span class="v">${euro(p.v)}</span></li>`).join('') : '<li class="muted">Noch keine Einkäufe in diesem Monat.</li>'}</ul></div>
  </div>
  ${stores.length ? `<div class="card"><h2>Nach Geschäft</h2>${stores.map(([n, v]) => `<div class="hbar"><div class="t"><span>${esc(n)}</span><b>${euro(v)}</b></div><div class="b"><div style="width:${v / smax * 100}%"></div></div></div>`).join('')}</div>` : ''}
  <div class="card"><div class="spread"><h2 style="margin:0">Letzte Einkäufe</h2>${rs.length > 5 ? `<button class="ghost small" onclick="A.tab('hist')">Alle</button>` : ''}</div>
    <div class="list">${recent.length ? recent.map(rowReceipt).join('') : `<p class="muted small">Tippe unten auf <b>+ Einkauf</b>, um den ersten Kassenzettel zu erfassen.</p>`}</div></div>`;
}

function rowReceipt(r){
  return `<div class="it" onclick="A.detail('${r.id}')"><div class="badge">${esc(r.store.slice(0, 3).toUpperCase())}</div>
  <div class="m"><div>${esc(r.store)}${r.hasImg ? ' <span title="Beleg archiviert">🧾</span>' : ''}</div><div class="small muted">${dateDE(r.date)} · ${esc(r.userName)} · ${r.items.length} Artikel</div></div><b>${euro(rTotal(r))}</b></div>`;

        <div class="small">${esc(o.status)}</div><div class="prog"><div style="width:${Math.round(o.p * 100)}%"></div></div>

      : `<p class="small muted">Leg den Bon flach auf einen dunklen Untergrund, gutes Licht, ganzer Bon im Bild. Lange Bons kannst du in zwei Fotos aufnehmen.</p>
        <button class="block" onclick="$('#fileCam').click()">📷 Foto aufnehmen</button><div style="height:8px"></div>
        <button class="sec block" onclick="$('#fileImg').click()">Bild aus Fotos wählen</button><div style="height:8px"></div>
        <button class="sec block" onclick="$('#filePdf').click()">📄 PDF oder Datei wählen</button><div style="height:8px"></div>
        <button class="ghost block" onclick="A.manual()">Ohne Foto manuell erfassen</button>`}
      <div style="height:6px"></div><button class="ghost block" onclick="A.step(1)">‹ Zurück</button></div>`;
  }
  // Schritt 3: Prüfen
  const imgs = d.images || [];
  d.discounts = d.discounts || [];
  const sumItems = r2(d.items.reduce((a, it) => a + (+it.price || 0), 0));
  const sumDisc = r2(d.discounts.reduce((a, x) => a + (+x.amount || 0), 0));
  const sum = r2(sumItems + sumDisc);
  const diff = d.bonTotal != null ? r2(d.bonTotal - sum) : null;
  const sizeUnits = ['', 'g', 'kg', 'ml', 'l', 'Stk'];
  const itemHtml = (it, i) => {
    const bp = basePrice(it), info = [];

    const hasSrc = it.src && imgs[it.src.i];
    return `<div class="item ${it.cat === 'pfand' ? 'pf' : ''}">
      <input class="name" value="${esc(it.name)}" placeholder="Artikel" onchange="A.setItem(${i},'name',this.value)">

        <select class="unit" onchange="A.setItem(${i},'unit',this.value)"><option ${unitOf(it)==='Stk'?'selected':''}>Stk</option><option ${unitOf(it)==='kg'?'selected':''}>kg</option></select>
        ${catSelect(it.cat, `A.setItem(${i},'cat',this.value)`, 'cat')}</div>
      <div class="r2"><input class="brand" list="brandList" placeholder="Marke / Eigenmarke" value="${esc(it.brand || '')}" onchange="A.setItem(${i},'brand',this.value)">
        <input class="qty" inputmode="decimal" placeholder="Inhalt" aria-label="Packungsgröße" value="${it.size && it.size.v > 0 ? String(it.size.v).replace('.', ',') : ''}" onchange="A.setItem(${i},'sizev',this.value)">

      <div class="up"><span>${info.join(' · ')}</span>${hasSrc ? `<button class="mini" onclick="A.toggleSnip(${i})">🧾 ${it._snip ? 'ausblenden' : 'Beleg'}</button>` : ''}</div>

    ${imgs.length ? `<button class="sec block" style="margin-top:10px" onclick="A.fullBeleg('draft')">🧾 Ganzen Beleg ansehen (${imgs.length} ${imgs.length === 1 ? 'Bild' : 'Bilder'})</button>` : ''}
    <datalist id="brandList"><option value="${BR_CHEAP}"><option value="${BR_LUX}">${knownBrands().map(b => `<option value="${esc(b)}">`).join('')}</datalist>
    <div id="items">${d.items.map(itemHtml).join('') || '<p class="muted small">Noch keine Artikel.</p>'}</div>
    <div class="row wrap" style="margin-top:10px"><button class="sec" onclick="A.addItem()">+ Artikel</button><button class="sec" onclick="A.addItem('pfand')">+ Pfand</button><button class="sec" onclick="$('#fileImg').click()">+ Foto</button><button class="sec" onclick="$('#filePdf').click()">+ PDF</button></div>
    <h4 style="margin:18px 0 4px">Rabatte auf den ganzen Bon</h4>
    <p class="small muted" style="margin:0 0 6px">z. B. Mitarbeiterrabatt, Coupon. Wird auf die Kategorien verteilt, die Artikelpreise für den Preisvergleich bleiben unverändert.</p>
    ${d.discounts.map((x, j) => `<div class="drow"><input value="${esc(x.name)}" onchange="A.setDisc(${j},'name',this.value)"><input class="price" inputmode="decimal" value="${moneyInput(x.amount)}" onchange="A.setDisc(${j},'amount',this.value)">
      ${x.src && imgs[x.src.i] ? `<button class="mini" onclick="A.fullBeleg('draft','d${j}')">🧾</button>` : ''}<button class="del" onclick="A.delDisc(${j})" aria-label="Entfernen">×</button></div>`).join('')}
    <button class="sec" onclick="A.addDisc()">+ Rabatt</button>
    <div class="sumbox"><div class="spread"><span>Artikel</span><span>${euro(sumItems)}</span></div>
      ${sumDisc ? `<div class="spread"><span>Rabatte</span><span>${euro(sumDisc)}</span></div>` : ''}
      <div class="spread" style="margin-top:4px"><span>Summe</span><b>${euro(sum)}</b></div>

    ${diff != null && Math.abs(diff) >= 0.01 ? `<div class="warnbox">Abweichung zum Bon: <b>${euro(diff)}</b>. Fehlt ein Artikel, Pfand oder Rabatt? <button class="ghost small" onclick="A.fixDiff()">Als „Sonstiges“ ausgleichen</button></div>` : ''}
    ${d.ocrText ? `<details><summary>Erkannten Text anzeigen</summary><pre class="ocr">${esc(d.ocrText)}</pre></details>` : ''}
    <div style="height:14px"></div><button class="block" onclick="A.saveDraft()" ${d.items.length ? '' : 'disabled'}>${d.id ? 'Änderungen speichern' : 'Einkauf speichern'}</button>
    <div class="row" style="margin-top:6px"><button class="ghost" onclick="A.step(${d.id ? 1 : 2})">‹ Zurück</button><span style="flex:1"></span><button class="ghost" style="color:var(--bad)" onclick="A.cancelDraft()">Abbrechen</button></div></div>`;
}

const STORE_COLORS = ['#1f6f5c','#e53935','#1e88e5','#fb8c00','#8e24aa','#00897b','#6d4c41','#3949ab','#c0ca33','#d81b60','#546e7a'];
function storeColor(st){ let i = S.settings.stores.indexOf(st); if (i < 0){ i = 0; for (const ch of st) i = (i * 31 + ch.charCodeAt(0)) >>> 0; } return STORE_COLORS[i % STORE_COLORS.length]; }
function aliasOf(name){ return (S.alias || {})[norm(name)]; }
const prodKey = name => { const a = aliasOf(name); return norm(a ? a.p : name); };
const pctTxt = v => (v > 0 ? '+' : '') + (v * 100).toLocaleString('de-DE', {maximumFractionDigits: 1, minimumFractionDigits: 1}) + ' %';
const pctBadge = v => v == null ? '' : `<span class="pbadge ${v > 0.005 ? 'up' : v < -0.005 ? 'down' : ''}">${pctTxt(v)}</span>`;
function priceData(){
  const map = {};
  live().forEach(r => r.items.forEach(it => {
    if (it.cat === 'pfand' || !(it.price > 0) || !norm(it.name) || /^ausgleich/.test(norm(it.name))) return;
    const bp = basePrice(it), bk = norm(it.brand || ''), key = prodKey(it.name) + '|' + bk + '|' + bp.u;
    const a = aliasOf(it.name);
    const p = map[key] || (map[key] = {key, unit: bp.u, bk, brand: it.brand || '', name: a ? a.p : it.name, cat: it.cat, names: new Set(), pts: []});
    p.names.add(it.name);
    p.pts.push({date: r.date, store: r.store, up: bp.v, qty: qtyOf(it), qunit: unitOf(it), size: it.size, price: it.price, t: r.createdAt || 0});
  }));
  return Object.values(map).map(p => {
    p.pts.sort((a, b) => a.date.localeCompare(b.date) || a.t - b.t);
    const last = p.pts[p.pts.length - 1];
    if (!aliasOf(p.name)) p.name = [...p.names].pop();
    p.last = last; p.cat = p.cat;
    // Teuerung: je Geschäft erster vs. letzter Preis (verschiedene Tage), dann Durchschnitt
    const byStore = {};
    p.pts.forEach(x => (byStore[x.store] = byStore[x.store] || []).push(x));
    const ch = [];
    p.stores = Object.entries(byStore).map(([st, xs]) => {
      const f = xs[0], l = xs[xs.length - 1];
      if (f.date !== l.date && f.up > 0) ch.push((l.up - f.up) / f.up);
      return {store: st, last: l.up, lastDate: l.date, min: Math.min(...xs.map(x => x.up)), avg: xs.reduce((a, x) => a + x.up, 0) / xs.length, n: xs.length};
    }).sort((a, b) => a.last - b.last);
    p.change = ch.length ? ch.reduce((a, b) => a + b, 0) / ch.length : null;
    p.cheapest = p.stores.length > 1 ? p.stores[0] : null;
    return p;
  });
}

function priceChart(p){
  const W = 340, H = 170, L = 46, R = 10, T = 10, B = 24;
  const ts = p.pts.map(x => new Date(x.date).getTime());
  let x0 = Math.min(...ts), x1 = Math.max(...ts); if (x0 === x1){ x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  let y0 = Math.min(...p.pts.map(x => x.up)), y1 = Math.max(...p.pts.map(x => x.up));
  const pad = (y1 - y0) * 0.15 || y1 * 0.1 || 0.1; y0 = Math.max(0, y0 - pad); y1 += pad;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const byStore = {}; p.pts.forEach(x => (byStore[x.store] = byStore[x.store] || []).push(x));
  const series = Object.entries(byStore).map(([st, xs]) => { const c = storeColor(st);
    const pts = xs.map(x => [X(new Date(x.date).getTime()), Y(x.up)]);
    return `<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(a => a.join(',')).join(' ')}"/>` + pts.map((a, i) => `<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="${c}"><title>${esc(st)} ${dateDE(xs[i].date)}: ${euro(xs[i].up)}</title></circle>`).join(''); }).join('');
  const grid = [y0, (y0 + y1) / 2, y1].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v.toFixed(2).replace('.', ',')}</text>`).join('');
  const d0 = new Date(x0).toISOString().slice(0, 10), d1 = new Date(x1).toISOString().slice(0, 10);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Preisverlauf">${grid}${series}
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--muted)">${dateDE(d0)}</text><text x="${W - R}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--muted)">${dateDE(d1)}</text></svg>
    <div class="row wrap small" style="gap:12px">${Object.keys(byStore).map(st => `<span><span class="dot" style="display:inline-block;background:${storeColor(st)};margin-right:4px"></span>${esc(st)}</span>`).join('')}</div>`;
}

async function shareOrDownload(filename, text, mime){
  const blob = new Blob([text], {type: mime || 'application/json'});
  try {
    const file = new File([blob], filename, {type: blob.type});
    if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: filename}); return true; }
  } catch(e){ if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}

function mergeReceipts(list){
  let added = 0, updated = 0;
  (list || []).forEach(r => {
    if (!r || !r.id || !Array.isArray(r.items)) return;
    const i = S.receipts.findIndex(x => x.id === r.id);
    if (i < 0){ S.receipts.push(r); added++; }
    else if ((r.updatedAt || 0) > (S.receipts[i].updatedAt || 0)){ S.receipts[i] = r; updated++; }
  });
  return {added, updated};
}

}

let tessPromise = null, worker = null, ocrProgress = null;
function loadTess(){
  if (window.Tesseract) return Promise.resolve();
  if (!tessPromise) tessPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = res; s.onerror = () => { tessPromise = null; rej(new Error('Die Texterkennung konnte nicht geladen werden. Bitte Internetverbindung prüfen.')); };
    document.head.appendChild(s);
  });
  return tessPromise;
}
async function getWorker(){
  await loadTess();
  if (!worker){
    worker = await Tesseract.createWorker('deu', 1, {logger: m => ocrProgress && ocrProgress(m)});
    await worker.setParameters({tessedit_pageseg_mode: '6', preserve_interword_spaces: '1'});
  }
  return worker;
}
function loadImg(url){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bild konnte nicht gelesen werden.')); i.src = url; }); }
function prepImage(img){
  let w = img.naturalWidth, h = img.naturalHeight;
  let sc = w > 1800 ? 1800 / w : (w < 1000 ? 1000 / w : 1);
  if (w * sc * h * sc > 14e6) sc = Math.sqrt(14e6 / (w * h));
  const cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
  const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, cv.width, cv.height);
  return enhance(cv);
}
function enhance(cv){
  const cx = cv.getContext('2d');
  const id = cx.getImageData(0, 0, cv.width, cv.height), d = id.data;
  for (let i = 0; i < d.length; i += 4){
    let g = d[i] * .299 + d[i+1] * .587 + d[i+2] * .114;
    g = (g - 128) * 1.5 + 140; g = g < 0 ? 0 : g > 255 ? 255 : g;
    d[i] = d[i+1] = d[i+2] = g;
  }
  cx.putImageData(id, 0, 0);
  return cv;
}

// Textebene einer PDF-Seite zu Zeilen zusammensetzen (nach y-Position gruppiert), mit Position auf der Seite
function pdfLines(tc, vp, imgIdx){
  const W = vp ? vp.width : 1, H = vp ? vp.height : 1;
  const parts = tc.items.filter(it => it.str && it.str.trim()).map(it => {
    const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || 8, w = it.width || 0;
    let b = null;
    if (vp){ const [vx, vy] = vp.convertToViewportPoint(x, y); b = [vx / W, (vy - h) / H, (vx + w) / W, (vy + h * 0.25) / H]; }
    return {x, y, h, w, s: it.str, b};
  });
  parts.sort((a, b) => b.y - a.y || a.x - b.x);
  const lines = [];
  parts.forEach(p => {
    const l = lines.find(l => Math.abs(l.y - p.y) < Math.max(2, p.h * 0.45));
    l ? l.p.push(p) : lines.push({y: p.y, p: [p]});
  });
  lines.sort((a, b) => b.y - a.y);
  return lines.map(l => { l.p.sort((a, b) => a.x - b.x); let out = '', lastEnd = null, box = null;
    l.p.forEach(p => { if (out && !out.endsWith(' ')) out += ' '; out += p.s; lastEnd = p.x + p.w;
      if (p.b) box = box ? [Math.min(box[0], p.b[0]), Math.min(box[1], p.b[1]), Math.max(box[2], p.b[2]), Math.max(box[3], p.b[3])] : p.b.slice(); });
    return {t: out.replace(/\s+/g, ' ').trim(), b: box, i: imgIdx || 0}; });
}
function archiveFrom(src, w, h){
  const sc = Math.min(1, 1200 / w);
  const cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(src, 0, 0, cv.width, cv.height);
  return {data: cv.toDataURL('image/jpeg', 0.68), w: cv.width, h: cv.height};
}
function textBounds(lines, i){
  const bs = lines.filter(l => l.b && l.i === i && /\d[.,]\d{2}|[a-zA-Z]{3}/.test(l.t)).map(l => l.b);
  if (!bs.length) return [0, 1];
  return [Math.min(...bs.map(b => b[0])), Math.max(...bs.map(b => b[2]))];
}
function tessLines(data, W, H, imgIdx){
  const ls = (data && data.lines) || [];
  if (!ls.length) return String((data && data.text) || '').split(/\r?\n/).map(t => ({t, b: null, i: imgIdx}));
  return ls.map(l => ({t: (l.text || '').trim(), b: [l.bbox.x0 / W, l.bbox.y0 / H, l.bbox.x1 / W, l.bbox.y1 / H], i: imgIdx}));
}
async function readPdf(file, setStatus, baseIdx){
  await loadPdfJs();
  setStatus('PDF wird geöffnet …', .05);
  const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  const n = Math.min(pdf.numPages, 6);
  const renderPage = async (pg, width) => {
    const vp0 = pg.getViewport({scale: 1}); const sc = Math.min(4, Math.max(1, width / vp0.width)); const vp = pg.getViewport({scale: sc});
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    await pg.render({canvasContext: cx, viewport: vp}).promise; return cv;
  };
  // 1. Versuch: digitale Textebene (eBon)
  let lines = [], images = [];
  for (let i = 1; i <= n; i++){
    const pg = await pdf.getPage(i);
    lines = lines.concat(pdfLines(await pg.getTextContent(), pg.getViewport({scale: 1}), baseIdx + i - 1));
  }
  const txt = lines.map(l => l.t).join('\n');
  if (/\d[.,]\d{2}/.test(txt) && txt.replace(/\s/g, '').length > 40){
    for (let i = 1; i <= n; i++){ setStatus(`Archiviere Seite ${i} …`, .5 + .5 * i / n); const cv = await renderPage(await pdf.getPage(i), 1200); images.push(archiveFrom(cv, cv.width, cv.height)); }
    return {lines, images};
  }
  // 2. Gescanntes PDF: Seiten rendern und Texterkennung
  const w = await getWorker(); lines = [];
  for (let i = 1; i <= n; i++){
    setStatus(`Lese Seite ${i} von ${n} …`, .1 + .9 * (i - 1) / n);
    const cv = await renderPage(await pdf.getPage(i), 1700);
    images.push(archiveFrom(cv, cv.width, cv.height));
    if (i === 1 && ui.ocr){ ui.ocr.url = images[0].data; render(); }
    const {data} = await w.recognize(enhance(cv));
    lines = lines.concat(tessLines(data, cv.width, cv.height, baseIdx + i - 1));
  }
  return {lines, images};
}

async function runOcr(file){
  const d = ui.draft;
  const append = d.step === 3;
  d.images = append ? (d.images || []) : [];
  const baseIdx = d.images.length;
  const isPdf = /pdf/i.test(file.type) || /\.pdf$/i.test(file.name || '');
  const url = isPdf ? '' : URL.createObjectURL(file);
  d.step = 2; ui.ocr = {url, status: isPdf ? 'PDF wird geladen …' : 'Bild wird vorbereitet …', p:0, error:null}; render();
  const upd = () => { if (ui.tab === 'buy' && ui.draft && ui.draft.step === 2){ const o = ui.ocr; const pr = document.querySelector('.prog div'); const st = document.querySelector('.prog') && document.querySelector('.prog').previousElementSibling; if (pr) pr.style.width = Math.round(o.p * 100) + '%'; if (st) st.textContent = o.status; } };
  const setStatus = (t, p) => { ui.ocr.status = t; ui.ocr.p = p; upd(); };
  ocrProgress = m => { if (isPdf && m.status === 'recognizing text') return; ui.ocr.status = OCR_STATUS[m.status] || m.status; ui.ocr.p = m.status === 'recognizing text' ? .3 + m.progress * .7 : m.progress * .3; upd(); };
  try {
    let lines, images;
    if (isPdf){ ({lines, images} = await readPdf(file, setStatus, baseIdx)); }
    else {
      const img = await loadImg(url);
      const cv = prepImage(img);
      images = [archiveFrom(img, img.naturalWidth, img.naturalHeight)];
      const w = await getWorker();
      setStatus('Lese Kassenzettel …', .3);
      const {data} = await w.recognize(cv);
      lines = tessLines(data, cv.width, cv.height, baseIdx);
    }
    images.forEach((im, k) => { im.tb = textBounds(lines, baseIdx + k); });
    d.images = d.images.concat(images.map(withUrl));
    const res = parseReceipt(lines, d.store);
    d.items = append ? d.items.concat(res.items) : res.items;
    d.discounts = (append ? (d.discounts || []) : []).concat(res.discounts);
    if (res.bonTotal != null) d.bonTotal = res.bonTotal;
    const text = lines.map(l => l.t).join('\n');
    d.ocrText = (append && d.ocrText ? d.ocrText + '\n— — —\n' : '') + text;
    d.step = 3; ui.ocr = null; render();
    const pf = res.items.filter(x => x.cat === 'pfand').length;
    toast(res.items.length ? `${res.items.length} Artikel erkannt${pf ? ` (davon ${pf}× Pfand)` : ''}${res.discounts.length ? ` + ${res.discounts.length} Rabatt` : ''} – bitte prüfen` : 'Keine Artikel erkannt – bitte manuell ergänzen');
  } catch(e){
    ui.ocr.error = (e && e.name === 'PasswordException') ? 'Das PDF ist passwortgeschützt.' : (e.message || String(e)); ui.ocr.status = 'Fehler'; render();
  }
}

    const q = s => '"' + String(s).replace(/"/g, '""') + '"';
    const lines = [['Datum','Geschäft','Person','Artikel','Marke','Menge','Einheit','Einzelpreis','Inhalt','Grundpreis','Grundpreis-Einheit','Kategorie','Bereich','Preis'].join(';')];
    rs.forEach(r => { r.items.forEach(it => { const c = CAT[it.cat] || CAT.sonstiges; lines.push([dateDE(r.date), q(r.store), q(r.userName), q(it.name), q(it.brand || ''), String(qtyOf(it)).replace('.', ','), unitOf(it), r2(it.price / qtyOf(it)).toFixed(2).replace('.', ','), q(sizeLabel(it.size)), r2(basePrice(it).v).toFixed(2).replace('.', ','), basePrice(it).u, q(c.name), GROUPS[c.g].name, r2(it.price).toFixed(2).replace('.', ',')].join(';')); });
      (r.discounts || []).forEach(x => lines.push([dateDE(r.date), q(r.store), q(r.userName), q(x.name), '', '', '', '', '', '', '', 'Rabatt', '', r2(x.amount).toFixed(2).replace('.', ',')].join(';'))); });
    shareOrDownload(`Einkaufsbudget_${ui.month}.csv`, '\ufeff' + lines.join('\r\n'), 'text/csv');
  },
  async backup(){
    const images = {};
    for (const r of S.receipts.filter(r => r.hasImg && !r.deleted)){ try { const x = await Arch.get(r.id); if (x) images[r.id] = x; } catch(e){} }
    shareOrDownload(`Einkaufsbudget_Sicherung_${fileStamp()}.json`, JSON.stringify({kind:'eb-backup', created: Date.now(), state: S, images}));
  },
  addStore(){ const v = $('#ns').value.trim(); if (!v) return; if (!S.settings.stores.includes(v)) S.settings.stores.push(v); save(); render(); },
  delStore(i){ S.settings.stores.splice(i, 1); save(); render(); },
  dictSet(i, c){ const k = ui.dictList[i]; S.dict[k] = Object.assign({}, S.dict[k], {c, t: Date.now()}); save(); toast('Gespeichert'); },
  dictDel(i){ const k = ui.dictList[i]; delete S.dict[k]; save(); render(); },
  async adminPw(){
    const old = prompt('Aktuelles Admin-Passwort:'); if (old == null) return;
    if ((await hashPw(old, 'admin')) !== S.admin.hash) return toast('Passwort falsch');
    const n1 = prompt('Neues Passwort (mind. 4 Zeichen):'); if (!n1 || n1.length < 4) return toast('Zu kurz');
    const n2 = prompt('Neues Passwort wiederholen:'); if (n1 !== n2) return toast('Stimmt nicht überein');
    S.admin.hash = await hashPw(n1, 'admin'); save(); toast('Admin-Passwort geändert');
  },

  /* Preise */
  prod(i){
    const p = ui.pList[i]; if (!p) return; ui.pCur = p;
    const others = priceData().filter(o => o.key !== p.key && o.unit === p.unit && o.bk === p.bk).sort((a, b) => a.name.localeCompare(b.name, 'de'));
    ui.pOthers = others;
    const hist = p.pts.slice().reverse().slice(0, 15);
    modal(`<h3>${esc(p.name)}${p.brand ? `<span class="bchip">${esc(p.brand)}</span>` : ''}</h3><p class="small muted">${(CAT[p.cat] || CAT.sonstiges).name} · Preis je ${p.unit} · ${p.pts.length}× gekauft ${p.change != null ? '· Teuerung ' + pctBadge(p.change) : ''}</p>
      ${priceChart(p)}
      <h4>Vergleich der Geschäfte</h4>
      <table class="tbl"><tr class="small muted"><td>Geschäft</td><td style="text-align:right">zuletzt</td><td style="text-align:right">günstigst</td><td>Ø</td></tr>
      ${p.stores.map((s, j) => `<tr><td><span class="dot" style="display:inline-block;background:${storeColor(s.store)};margin-right:6px"></span>${esc(s.store)}${j === 0 && p.stores.length > 1 ? ' <span class="pbadge down">am günstigsten</span>' : ''}<div class="small muted">${s.n}× · zuletzt ${dateDE(s.lastDate)}</div></td><td style="text-align:right"><b>${euro(s.last)}</b></td><td style="text-align:right">${euro(s.min)}</td><td>${euro(s.avg)}</td></tr>`).join('')}</table>
      <h4>Letzte Käufe</h4>
      <table class="tbl">${hist.map(x => `<tr><td>${dateDE(x.date)} · ${esc(x.store)}<div class="small muted">${x.qunit === 'kg' ? x.qty.toLocaleString('de-DE', {maximumFractionDigits: 3}) + ' kg' : x.qty + '×'}${x.size ? ' ' + sizeLabel(x.size) : ''} für ${euro(x.price)}</div></td><td>${euro(x.up)}/${p.unit}</td></tr>`).join('')}</table>
      <h4>Für den Vergleich zusammenfassen</h4>
      <p class="small muted" style="margin:2px 0 6px">Heißt der gleiche Artikel in einem anderen Geschäft anders (z. B. „Bananen lose“), fasse ihn hier zusammen. Angeboten werden Artikel derselben Marke bzw. Eigenmarken-Stufe. Erfasste Namen: ${[...p.names].map(esc).join(', ')}</p>
      <select id="mergeSel"><option value="">Mit Artikel zusammenfassen …</option>${others.map((o, j) => `<option value="${j}">${esc(o.name)} (${o.pts.length}×)</option>`).join('')}</select>
      <div class="row" style="margin-top:8px"><button class="sec" style="flex:1" onclick="A.mergeProd()">Zusammenfassen</button><button class="sec" onclick="A.renameProd()">Umbenennen</button></div>
      <div style="height:10px"></div><button class="ghost block" onclick="A.closeModal()">Schließen</button>`);
  },
  setAlias(names, target){ const t = Date.now(); S.alias = S.alias || {}; names.forEach(n => S.alias[norm(n)] = {p: target, t}); save(); },
  mergeProd(){
    const j = $('#mergeSel').value; if (j === '') return toast('Bitte einen Artikel auswählen');
    const o = ui.pOthers[+j], p = ui.pCur;
    const target = o.pts.length >= p.pts.length ? o.name : p.name;
    this.setAlias([...p.names, ...o.names], target); this.closeModal(); render(); toast('Zusammengefasst als „' + target + '“');
  },
  renameProd(){
    const p = ui.pCur; const n = prompt('Name für den Preisvergleich:', p.name);
    if (!n || !n.trim()) return; this.setAlias([...p.names], n.trim()); this.closeModal(); render(); toast('Umbenannt');
  },

  /* Mitarbeiter */
  async exportMine(){
    const mine = S.receipts.filter(r => r.userId === meId());
    const myAlias = {}; Object.entries(S.alias || {}).forEach(([k, v]) => { if ((v.t || 0) > (S.pkgDate || 0)) myAlias[k] = v; });
    const myDict = {}; Object.entries(S.dict).forEach(([k, v]) => { if ((v.t || 0) > (S.pkgDate || 0)) myDict[k] = v; });
    const images = {};
    for (const r of mine.filter(r => r.hasImg && !r.deleted && (r.updatedAt || 0) > (S.lastExport || 0))){ try { const x = await Arch.get(r.id); if (x) images[r.id] = x; } catch(e){} }
    const ok = await shareOrDownload(`Einkaeufe_${safe(meName())}_${fileStamp()}.json`, JSON.stringify({kind:'eb-export', v:2, created: Date.now(), user: {id: S.me.id, name: S.me.name}, receipts: mine, dict: myDict, alias: myAlias, images}));
    if (ok){ S.lastExport = Date.now(); save(); render(); toast('Datei erstellt – bitte an den Admin schicken'); }
  }
};
window.A = A; window.ui = ui;
render();
if (session && S.seenVersion !== VERSION) A.whatsNew();
</script>
</body>
</html>
